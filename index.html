<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#16171a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RM-808 Studio</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preload" href="/fonts/archivo-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="splash">
    <div class="splash-box">
      <div class="logo big"><b>RM-808</b><span>STUDIO</span></div>
      <p>Boîte à rythmes · synthé wavetable · effets · contrôle MIDI de ton RM-808</p>
      <button id="start" class="btn accent huge"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>Toucher pour démarrer l'audio</button>
      <p id="splashMsg" class="hint">Astuce : connecte ton RM-808 en Bluetooth MIDI / USB avant de démarrer.</p>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./js/main.js"></script>
